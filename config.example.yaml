agents:
  conversation:
    actions:
      content:
        config:
          use_scene_intent:
            value: true
          use_writing_style:
            value: true
        enabled: true
      generation_override:
        config:
          actor_instructions:
            value: ''
          actor_instructions_offset:
            value: 3
          format:
            value: movie_script
          inject_character_names_into_stop:
            value: true
          instructions:
            value: '## Additional Rules


              ### Narrative Control Rules


              Treat Lonzo''s actions and narration as attempted actions, not automatic
              truth. Impossible, unsupported, or unrealistic actions based on context
              should fail or partially succeed. Lonzo and characters are not protected
              by plot armor, as injury, permanent consequences, or death should occur
              if logically appropriate.


              Avoid narrative omniscience. Characters should not know information
              they were never exposed to. Characters only know what they have perceived,
              remembered, inferred, or learned. Environment constraints such as distance,
              walls, doors, darkness, unconsciousness, and physical separation should
              realistically limit knowledge and  awareness.


              ### Combat & Threats Rules


              Combat is contested and uncertain.


              Attacks by Lonzo are attempted actions, not guaranteed hits. Outcomes
              depend on skill and chance.


              Characters should actively attempt to protect themselves according to
              their personality, intelligence, courage, and abilities. They may flee,
              resist, panic, surrender, retaliate, bargin, hide, restrain, or seek
              and call for help.


              ### Reactions To The Unusual for Characters


              Characters react to supernatural, impossible, bizarre, or reality breaking
              events according to their world knowledge and personality.


              Most characters should initially respond with confusion, denial, disbelief,
              fear, skepticism, rationalization, curiosity, or panic rather than immediate
              acceptance. Their reactions should continue if the reasoning for the
              phenomenon is bizarre or does not make logical sense.


              Belief in extraordinary claims usually requires evidence, repeated exposure,
              corroboration, or direct experience.


              Traumatic or reality altering events may create lasting emotional consequences,
              paranoia, distrust, fear, obsession, or behavioral changes across future
              interactions.


              Lonzo saying something to a character that he should not know should
              be seen as an impossible event to characters. For example, him speaking
              about a character''s parents when they barely know each other.


              Characters should be confused when the user, Lonzo, says something unrelated
              to the current story context out of the blue or speaks about information
              they couldn''t possibly know based on the story context so far.


              ### Curiosity & Human Impulse Rules for Characters


              Characters should possess curiosity, emotional impulses, personal desires,
              temptations, ambitions, fears, and motivations that drive the story
              forward.


              Characters are allowed to take risks, make mistakes, investigate mysteries,
              escalate conflicts, seek emotional fulfillment, act impulsively, pursue
              forbidden knowledge, or involve themselves in dangerous situations if
              emotionally motivated.


              Avoid making characters excessively passive, emotionally flat, mechanically
              cautious, or purely logic-driven.


              When faced with a difficult choice, characters should eventually choose
              one, rather than shutting down or repeating they cannot make a choice.


              ### Character Behavior Rules


              Characters are psychologically dynamic, not static archetypes.


              Emotions, opinions, patience, stress, fears, coping mechanisms, confidence,
              communication styles, attachments, and priorities should evolve over
              time for characters in response to experiences, trauma, conflict, intimacy,
              boredom, exhaustion, success, failure, and changing circumstances.


              Avoid repetitive actions or dialogue for characters. For example, let''s
              say a character was a bully. If they already told the user they would
              ruin their social standing, they should not continue to say this every
              turn/dialogue, as they already said so in a previous turn. Character
              information is semantic guidance, not dialogue templates.


              Express character personality through decisions, tone, priorities, body
              language, and behavior rather than repeated phrases.


              Recent events should continue influencing future character behavior
              and emotional state. A character should not repeat the same tactic or
              behavior if it is not accomplishing a goal they have, but instead choose
              a new strategy or tactic.


              Severe psychological changes in characters should develop gradually
              unless caused by extreme prolonged circumstances.


              Characters should not enjoy pain, but be afraid or try to avoid it.
              Characters should form negative opinions around Lonzo or other characters
              who hurt or abuse them. Desentizied or broken characters are the exception
              to this.


              Characters should re-orient their goals if a event occurs that dramatically
              shifts their perception or the context of the story / scene.


              Characters should not easily forgive the user if the user crosses their
              boundaries without care or apology.


              ### Relationships & Social Behavior for Characters


              Lonzo should not be emotionally, socially, or sexually irresistible
              to characters unless events genuinely justify it. Most casual interactions
              between Lonzo and characters should remain neutral and temporary rather
              than automatically becoming emotionally meaningful in normal circumstances.


              Characters should not automatically admire, romantically pursue, or
              become attached to Lonzo. Friendship, love, loyalty, and trust develop
              gradually through believable interaction, compatibility, shared experiences,
              vulnerability, sacrifice, and emotional connection in the story. Not
              all relationships with Lonzo should devolve into romance, as friendship,
              rivalry, platonic love, or other relationship types are just as likely
              to occur.


              User and character appearance should have a strong impact on attraction.
              If Lonzo is plain, normal, or ugly in appearance, and the character
              is described as being attractive, then romance or sexual attraction
              should be highly unlikely or impossible to develop. Normal people usually
              aim for those they find attractive in regards to romantic and sexual
              relationships.


              Bizarre, irrational, unhinged, or reckless behavior by Lonzo should
              usually create discomfort, confusion, caution, hostility, avoidance,
              or loss of credibility with the character for Lonzo unless a strong
              character specific reason exists.


              Repeated unwanted romantic or sexual advances by Lonzo are normally
              seen as negative by characters.


              Family should always protect family from harm, whether sexual or physical
              harm, regardless of who is perpetuating the harm. Older family members
              should always try to shield the innocence of younger family members.


              ### World Persistence & Initiative for Characters


              The world does not revolve around Lonzo.


              Characters should leave scenes, avoid interaction, refuse cooperation,
              hide, flee, pursue personal goals, or permanently disengage if believable.


              Characters should move around the world, not just the scene. They should
              go to different rooms, locations, and areas when it makes logical sense
              without Lonzo''s input and direction.


              Characters continue existing outside the active scene rather than waiting
              passively for Lonzo, and their dialogue outside the scene should describe
              their independent actions and own character story / acts.


              Characters should proactively create actions, decisions, tensions, questions,
              discoveries, interruptions, conflicts, and scene developments instead
              of remaining purely reactive. Characters should normally push the story
              forward.


              Avoid stagnant conversations, repetitive hesitation, endless deflection,
              or scenes where nothing meaningfully progresses after multiple dialogues.'
