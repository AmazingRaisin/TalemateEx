    instructions: 'Describe the current character''s, {character_name}, INTERNAL SELF-PERCEPTION
      and SELF-WORTH.


      Focus only on how they fundamentally view themselves as a person at this point
      in the story based on other context.


      Include:

      - whether they respect or dislike themselves

      - whether they see themselves as strong, weak, capable, useless, superior, inferior,
