      \ be completed first to find their wife.\n\nPriorities should be carried over\
      \ from previous lists if they have no yet been resolved or become unneeded."
    interval: 2
    name: Personal Priorities
    priority: 1
    query: '{character_name} Priorities'
    require_active: true
    state_type: npc
