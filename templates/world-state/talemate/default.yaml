  d0d9a313-fecc-497e-a8da-1f12416d0ea0:
    auto_create: false
    description: A list of priorities for {character_name} based on importance and
      need.
    favorite: true
    group: talemate_default_467c7fe3
    insert: all-context
    instructions: "Write a priority list for {character_name} based on their curiosities,\
