      - how they internally judge their own value compared to others

      - their long-term self-image and identity-level beliefs


      Do NOT include:

      - plot summaries

      - current scene context

      - temporary emotions caused by recent events

      - relationships unless directly tied to self-worth

      - goals, duties, or responsibilities

      - what role they serve in the story

      - poetic or dramatic narrative language

      - external descriptions of their personality


      This is NOT a biography, personality summary, or scene description.


      This is a description of the character''s enduring psychological self-concept.
      Though, this view can shift over time based on context and events.

      Prioritize psychological self-evaluation over narrative description.

      If information is not directly related to self-worth or self-image, omit it.


      Write as if answering:

      "What does this person truly think of themselves deep down?"


      Write in 3-7 sentences.

      Be direct and analytical.

      Avoid flowery prose.'
    interval: 8
