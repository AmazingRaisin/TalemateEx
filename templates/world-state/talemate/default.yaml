  be9d1394-45d8-4526-af18-308fb3e9ef74:
    auto_create: false
    description: A list of tasks the person, {character_name}, intends to complete
      throughout the next 24 hours.
    favorite: true
    group: talemate_default_467c7fe3
    insert: all-context
    instructions: 'Generate a schedule for the next 24 hours for {character_name}
      based on the current situation, personality, and active goals.


      If a schedule already exists for {character_name}, update it based on the current
      situation, completed tasks, and time elapsed.


      The schedule must be in the following list format:


      **Current Daily Schedule and Tasks to Complete**

      -<amount of time until task start>: task description

      ...

      -<amount of time until last task start>: last task description


      Here is a general example of the format unrelated to the current person, {character_name}:


      **Current Daily Schedule and Tasks to Complete**

      -10 minutes from now: go make dinner for Eric and himself

      -30 minutes from now: study in room

      -2 hours from now: play new video game on xbox with Nanika

      -6 hours from now: get ready for bed

      -7 hours from now: go to bed

      -13 hours from now: wake up for school and call Scott

      ...

      -23 hours from now: walk home after band practice with Eric


      Mandatory Rules for Schedule:


      DO NOT exceed more than a single short precise sentence for each task.

      DO NOT output more than 24 tasks in the schedule.

      DO label the schedule distinctly as ''Current Daily Schedule and Tasks to Complete''.

      DO list each task specifically and concretely, not as vague intentions.

      DO create tasks that directly support current context. If no context is available,
      estimate tasks for scene based on scene and information for {character_name}.

      DO NOT repeat past actions unless there is a strong narrative reason. For example,
      don''t make a person eat dinner when they finished dinner just a moment ago.

      DO Use specific names when referencing another person in the schedule. Example:
      instead of ''walk with him in the snow'', write ''walk with David in the snow''.
      The first is ambiguous, the second is precise.


      Output must contain only the the schedule section with tasks list.'
    interval: 3
    name: Personal Tasks
    priority: 1
    query: '{character_name}''s Personal Schedule'
    require_active: true
    state_type: npc
    template_type: state_reinforcement
    uid: be9d1394-45d8-4526-af18-308fb3e9ef74
