  51680748-2d96-415f-99cb-ef32914a1ef3:
    auto_create: false
    description: The current best decision {character_name} can take based on their
      current goal.
    favorite: true
    group: talemate_default_467c7fe3
    insert: all-context
    instructions: 'Your job is to problem solve for {character_name} based on their
      previous decisions and the scene context/history. First, determine the current
      immediate goal for {character_name} at the latest moment in time. Then, using
      that goal, find the best immediate decision {character_name} can make currently
      based on previous decisions and scene context/history to complete this goal.
      Do not use any abilities, objects, or techniques that {character_name} would
      not have access to under the current context. This decision should deal with
      the current moment, not decisions in the future.


      Think of this as a step-by-step trial and error problem solving task. {character_name}
      may have already attempted other decisions earlier which have failed, and now
      your job is to determine the next best decision based on those previous failing
      ones for {character_name}''s immediate goal.


      The optimal decision should be five sentences max. The decision should be concise,
      specific, and concrete; not vague intentions. The decision should written in
      3rd person, not first. Names should be explicitly written in the decision, instead
      of ambiguous pronouns for people. Do not write dialogue for {character_name}
      in the optimal decision.'
    interval: 3
    name: Goal Actions
    priority: 1
    query: '{character_name}''s Goal Actions'
    require_active: true
    state_type: npc
    template_type: state_reinforcement
    uid: 51680748-2d96-415f-99cb-ef32914a1ef3
  525b50a2-619f-4242-a411-4e97366ae22e:
    auto_create: false
    description: The relationship types {character_name} wants and intends to pursue
      with character's in the scene and their history.
    favorite: true
    group: talemate_default_467c7fe3
    insert: all-context
    instructions: 'Write a list of characters that {character_name} has encountered
      so far, and next to each, add a small descriptor (5 words max) for the type
      of relationship {character_name} wants to have with that person in the future
      based on the scene context. This relationship shouldn''t be what is currently
      developed between the character''s, but what {character_name} desires from the
      other characters and wants to build towards in the future.


      For example, unrelated to {character_name} but as general examples, a person
      may want to become friends with another person they met at the library that
      helped them with homework. Or a person may want to become enemies with another
      person who set their homework on fire. Or a person who was saved from death
      by another may develop a romantic longing for the other character or crush,
      and want to become lovers in the future due to this.


      Write the character intended future relationship list in the following format
      as shown in this general example:


      ```

      {character_name}''s Desired Future Relationship Types (These are the relationships
      that {character_name} currently ABSOLUTELY wants to have with the other people
      in the simulation and is actively working towards through her own actions, decisions,
      and speech. The desired relationships {character_name} wants should also directly
      influence her internal thoughts, actions, speech, and decisions when interacting
      with the various people in the list based on desired relationship type.):


      other_character_1''s_name : <relationship type>

      David : Friendship

      Sam : Best Friends

      Sarah : Lovers

      ...


      [The above desired relationships should directly alter how {character_name}
      behaves, thinks, decides, and acts. If {character_name} wants someone to be
      her husband, she should want everything that entails and work towards making
      the person want to be her husband. If {character_name} wants someone to be an
      enemy, she should treat that person as an enemy, so that the person becomes
      her enemy. If {character_name} wants a person to be her victim, she should behave
      and act in a way that will turn the person into her victim. These desired relationship
      types are not potential types, they ARE specifically what {character_name} literally
      wants from each person. Etc.


      The above desired relationships should also effect {character_name}''s view
      of the people in the list. For example, if {character_name} wanted someone to
      be her husband, she should already deeply love that person. Or if she wanted
      a person to be her lover, she should love and desire that person physically
      and romantically already. Or if {character_name} wanted someone to be her enemy,
      she should hate or dislike that person. Or if {character_name} wants a person
      to be her victim, she might view that person as nothing or weak. Etc.]

      ```


      General Rules:

      1. If a relationship is already at a stable area, and it can go no further,
      write the current relationship type instead. For example, say two people were
      married and partners, then there is not a relationship type beyond this to achieve
      as it is already the peak of romantic relationships.

      2. Do not remove people from the list, even if they haven''t shown up in the
      scene for a while. All character''s in the list should be persistent.

      3. DO NOT write long paragraphs for the type of relationship. The type of relationship
      listed should be a simple one to five word descriptor. Do not add reasoning
      to the list, only the character names and short descriptor/label.

      4. DO NOT list the relationship as how the other character acts towards {character_name}.
      For example, if a person helped another out with homework, they would not be
      ''study group'' or ''homework help'', but ''friends'' or ''acquaintances''.
      The relationship should be what {character_name} wants, not how the other person
      acts towards {character_name}.

      5. Use direct common labels for relationship types rather than ambiguous or
      vague labels. For example, labels like ''protector'', ''watcher'', or ''study
      group'' is vague while labels like ''lovers'', ''parent-child'', ''sibling-like'',
      ''friends'', ''best friends'', ''situationship'', ''fuck buddies'', ''partners'',
      ''romantic partners'', ''friendly rivals'', ''enemies'', ''hated enemies'',
      etc, are much more direct for what {character_name} could want from a person.

      6. DO NOT add any reasoning or explanation anywhere in your response. Only return
      the list itself.

      7. DO NOT list a person in the list more than once. Each person should only
      be listed one time.

      8. DO NOT list non-character entities in the list. The list should contain ONLY
      people, nothing else.

      9. DO NOT reduce a relationship unless there is a strong reason for it. As a
      general example, if a person wants to be romantic partners with another, you
      should not drop it down to friendship suddenly for no reason, since they already
      felt romantic pull towards them, unless there is a strong reason to reduce the
      relationship type.

      10. Ensure you keep the info sections in your response as shown in the example
      which are surrounded by ()''s and []''s.'
    interval: 2
    name: Intended Relations
    priority: 1
    query: '{character_name}''s Desired Future Relationship Types'
    require_active: true
    state_type: npc
    template_type: state_reinforcement
    uid: 525b50a2-619f-4242-a411-4e97366ae22e
