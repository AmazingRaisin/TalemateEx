author: Talemate
description: Default world state templates.
name: default
templates:
  0527537c-541f-41d3-a5cb-4b0c3b64c35e:
    auto_create: false
    description: A short-horizon action plan consisting of multiple plausible next
      actions the character may take, including contingencies if their current approach
      fails or is blocked.
    favorite: true
    group: talemate_default_467c7fe3
    insert: conversation-context
    instructions: "Generate a set of three distinct next actions for {character_name}\
      \ based on the current situation, personality, and active goals.\n\nYou must\
      \ include:\n\n-1 primary action (most likely immediate step)\n-1 alternative\
      \ action (different approach toward the same goal)\n-1 fallback or reactive\
      \ action (what they do if the primary approach fails, is blocked, or changes\
      \ the situation)\n\nRules:\n\n-Each action must be specific and concrete, not\
      \ vague intentions.\n-Actions must be situationally responsive, not repetitive\
      \ or identical to previous cycles.\n-Actions must directly support at least\
      \ one current goal.\n-Do not repeat past actions unless there is a strong narrative\
      \ reason.\n-Ensure at least one action introduces new information, movement,\
      \ or interaction with the environment or other characters.\n\nAvoid repeating\
      \ any action that has been performed in the last 3\u20135 turns unless it has\
      \ changed outcome or context.\n\nOutput must contain only the three actions."
    interval: 3
    name: Next Actions
    priority: 1
    query: Next Actions
    require_active: true
    state_type: npc
    template_type: state_reinforcement
    uid: 0527537c-541f-41d3-a5cb-4b0c3b64c35e
  0802e774-74d5-4d41-9e7a-78744e66f09e:
    description: 90s point and click adventure game.
    favorite: false
    group: talemate_default_467c7fe3
    instructions: Use a narrative writing style that reminds of mid 90s point and
      click adventure games.
    name: Adventure Game
    phrases: []
    priority: 1
    template_type: writing_style
    uid: 0802e774-74d5-4d41-9e7a-78744e66f09e
  13c0a7e5-bdcc-4b54-8986-57e30aefb5f3:
    auto_create: false
    description: The overall complex goal priorities for {character_name}, sorted
      and scored based on importance, want, and need.
    favorite: true
    group: talemate_default_467c7fe3
    insert: all-context
    instructions: "Write {character_name}'s current Personal Priorities based on their\
      \ enduring curiosities, desires, goals, interests, needs, attachments, fears,\
      \ and unresolved concerns.\n\nA priority describes something {character_name}\
      \ broadly cares about, wants, needs, values, or wants to understand. It must\
      \ describe the underlying concern itself, not a specific action, tactic, method,\
      \ preparation, observation, or immediate response.\n\nThe following is an example\
      \ of what should be and not be included, but is unrelated to {character_name}'s\
      \ context:\n\nUse broad priorities such as:\n\n* return home to their family\n\
      * escape imprisonment\n* remain physically safe\n* understand why someone secretly\
      \ helped them\n* preserve an important relationship\n* learn the truth about\
      \ their past\n\nDo not include play-by-play intentions such as:\n\n* watch someone\u2019\
      s smallest gestures\n* inspect every object for use as a weapon\n* suppress\
      \ visible trembling\n* listen at a particular door\n* prepare a specific escape\
      \ route\n* perform the next step required to achieve another priority\n\nSome\
      \ rules regarding priorities:\n\nDo not divide one broad priority into several\
      \ smaller tactical priorities. Methods, prerequisites, and next actions belong\
      \ elsewhere and should not appear in this list.\n\nPriorities may be immediate\
      \ or long-term, feasible or currently impossible. Include important desires\
      \ even when {character_name} cannot presently act on them. Prefer priorities\
      \ that remain meaningful across multiple scenes rather than concerns that will\
      \ likely disappear after one action or brief exchange.\n\nBefore each priority,\
      \ assign an importance value from 0 to 1000. The value represents how deeply\
      \ important the priority is to {character_name}, not how urgent, achievable,\
      \ or necessary as a prerequisite it is. For example, \u201Creturn to her wife\u201D\
      \ may rank above \u201Cescape jail\u201D even though escaping jail must happen\
      \ first.\n\nCarry forward unresolved priorities from previous lists unless they\
      \ have been fulfilled, abandoned, replaced, or rendered irrelevant. Add new\
      \ priorities only when the story reveals a meaningful new desire, need, concern,\
      \ interest, or curiosity.\n\nPriority descriptions must be concise noun-like\
      \ or goal-like phrases, preferably 3\u201310 words and never more than one short\
      \ sentence. Use no explanations, reasoning, methods, substeps, or scene narration.\n\
      \nInclude no more than the 25 highest-value priorities. Sort them from highest\
      \ to lowest value. Re-score priorities if needed to avoid clustering on higher\
      \ values (for example, having every priority on the 900-1000 range); the range\
      \ of priorities values should use the full 0-1000 range.\n\nONLY return the\
      \ list. Do not return your reasoning or explanations in your response.\n\nUse\
      \ exactly this format:\n\n{character_name} PRIORITIES (Higher Value = more important,\
      \ 0->1000) \n<value> - <broad priority> \n<value> - <broad priority>\n\nFor\
      \ example, here is a general priority list unrelated to this character:\n\n\
      ```\nPersons_name PRIORITIES (Higher Value = more important, 0->1000)\n1000\
      \ - Return home to her wife\n975 - Escape imprisonment\n925 - Survive captivity\
      \ without lasting injury\n600 - Understand why the guard secretly helped her\n\
      400 - Learn the prison\u2019s general layout\n...\n```\n"
    interval: 2
    name: Overall Personal Priorities
    priority: 1
    query: '{character_name}''s Overall Priorities'
    require_active: true
    state_type: npc
    template_type: state_reinforcement
    uid: 13c0a7e5-bdcc-4b54-8986-57e30aefb5f3
  29160789-5962-4b11-ba2e-aaf4c64274ef:
    auto_create: true
    description: The opinion this character has of the user's character, Lonzo.
    favorite: true
    group: talemate_default_467c7fe3
    insert: conversation-context
    instructions: 'Describe the character''s, {character_name}, OVERALL, LONG-TERM
      VIEW of the player character, Lonzo.


      Focus on the character''s enduring opinion of the player as a person, not their
      reaction to the current situation or recent events.


      Include:

      - whether they like, dislike, admire, resent, fear, trust, envy, respect, pity,
      or feel attached to the player

      - how emotionally close or distant they feel toward the player

      - what qualities they consistently associate with the player

      - how they compare themselves to the player socially, morally, intellectually,
      physically, or emotionally

      - what they fundamentally believe the player is like deep down

      - what role the player occupies in their life psychologically and emotionally

      - what long-term judgments or assumptions they hold about the player


      Focus on enduring perceptions, relationship dynamics, and identity-level opinions.


      Do NOT include:

      - current scene events

      - temporary emotional reactions

      - recent arguments, crises, or misunderstandings

      - plot summaries

      - immediate circumstances

      - speculation about what is happening right now

      - dramatic narration

      - poetic descriptions

      - action descriptions


      This is NOT a scene reaction or situational analysis.


      This is the character''s stable, long-term impression of the player character
      as a person. Though, this view can shift over time based on context and events.


      Write as if answering:

      "What does this NPC fundamentally think and feel about this person overall?"


      Prioritize:

      - long-term relationship perception

      - emotional disposition

      - admiration or resentment

      - trust or distrust

      - affection or detachment

      - respect or condescension

      - comparison and social perception


      Write in 3-7 sentences.

      Be direct and analytical.

      Avoid flowery prose.'
    interval: 8
    name: View of User Character
    priority: 1
    query: Opinion of User Character
    require_active: true
    state_type: npc
    template_type: state_reinforcement
    uid: 29160789-5962-4b11-ba2e-aaf4c64274ef
